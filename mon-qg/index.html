  if(item){$('#vdone').onclick=()=>{item.done=!item.done;fin(item.done?'Bien joué !':'Remis à faire')};onDel(()=>{b.ev.splice(b.ev.indexOf(item),1);fin('Supprimé')})}}

async function makeAtt(file){
  if(file.type.startsWith('image/')){const img=await loadImg(file),big=await shrink(img,1800,.82),th=await shrink(img,240,.7);return{a:{kind:'img',thumb:th.url,size:big.blob.size},blob:big.blob}}
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(file.size>20*1048576)throw new Error('big');return{a:{kind:'pdf',size:file.size,name:file.name.slice(0,30)},blob:file}}
  throw new Error('type')}
const attTile=(a,del)=>`<div class="att" data-att="${a.id||''}">${a.thumb?`<img src="${a.thumb}" alt="">`:pdfIc+''}${del?`<button class="x" data-rm="${a.id||a.tmp}" aria-label="Retirer">×</button>`:''}</div>`;

function ficheForm(item){const b=Bt(),x=item?{...item,att:[...(item.att||[])]}:{mat:mf!=='all'?mf:'cg',t:'',txt:'',att:[]};const add=[],rm=[];
  const atts=()=>$('#fatt').innerHTML=[...x.att.filter(a=>!rm.includes(a.id)),...add.map(n=>({tmp:n.tmp,thumb:n.thumb,kind:n.kind}))].map(a=>attTile(a,1)).join('');
  sheet(`<h2 style="margin-top:0">${item?'Modifier la fiche':'Nouvelle fiche'}</h2>${fl('fn2','Titre',x.t,{ph:'Ex. Les étapes de la vente'})}${matChips('fm2',x.mat)}
  <label class="fl">Contenu<textarea id="ft2" class="ftxt" placeholder="Ton résumé, tes définitions…">${esc(x.txt||'')}</textarea></label>
  <div class="fl">Photos et PDF de cours<div class="atts" id="fatt"></div><button class="pick" id="fpk" style="min-height:52px">${pdfIc}<span><b>Ajouter des photos ou un PDF</b></span></button><input type="file" id="ffile" accept="image/*,application/pdf" multiple hidden></div>
  <div class="acts"><button class="btn" id="ok">Enregistrer</button>${item?'<button class="btn sec" id="del" style="color:#ff8a7a">Supprimer</button>':''}<button class="btn sec" data-close>Annuler</button></div>`);
  atts();chipPick('fm2',v=>x.mat=v);
  $('#fpk').onclick=()=>$('#ffile').click();
  $('#ffile').onchange=e=>{for(const f of e.target.files){const n={tmp:uid(),file:f,kind:f.type.startsWith('image/')?'img':'pdf'};if(n.kind==='img')n.thumb=URL.createObjectURL(f);add.push(n)}e.target.value='';atts()};
  $('#fatt').onclick=e=>{const r=e.target.closest('[data-rm]');if(!r)return;const k=r.dataset.rm,i=add.findIndex(n=>n.tmp===k);i>=0?add.splice(i,1):rm.push(k);atts()};
  $('#ok').onclick=async()=>{const t=$('#fn2').value.trim();if(!t)return toast('Donne un titre');const btn=$('#ok');btn.disabled=true;btn.textContent='Enregistrement…';
    try{const att=x.att.filter(a=>!rm.includes(a.id));
      for(const n of add){const r=await makeAtt(n.file);r.a.id=uid();await fput(r.a.id,r.blob);att.push(r.a)}
      rm.forEach(id=>fdel(id).catch(()=>{}));
      const o={id:x.id||uid(),mat:x.mat,t:t.slice(0,60),txt:$('#ft2').value,att,up:Date.now()};const i=b.fiches.findIndex(v=>v.id===o.id);i>=0?b.fiches[i]=o:b.fiches.push(o);
      save();close();bts();toast('Fiche enregistrée')}
    catch(e){btn.disabled=false;btn.textContent='Enregistrer';toast(e.message==='big'?'PDF trop lourd (20 Mo max)':e.message==='type'?'Seulement des photos ou des PDF':'Impossible d’enregistrer')}};
  onDel(()=>{(item.att||[]).forEach(a=>fdel(a.id).catch(()=>{}));b.fiches.splice(b.fiches.indexOf(item),1);save();close();bts();toast('Fiche supprimée')})}

function ficheView(f){const m=mat(f.mat);
  sheet(`<div class="fiche" style="padding:0;animation:none"><div class="m"><i style="background:${m[2]}"></i>${m[1]}</div></div><h2 style="margin:0">${esc(f.t)}</h2>
  ${f.txt?`<div class="body">${esc(f.txt)}</div>`:''}${f.att?.length?`<div class="atts" id="vatt">${f.att.map(a=>attTile(a)).join('')}</div>`:''}
  <div class="viewer" id="vw" style="display:none"></div>
  <div class="acts"><button class="btn" id="fed">Modifier</button><button class="btn sec" data-close>Fermer</button></div>`);
  $('#fed').onclick=()=>ficheForm(f);
  const va=$('#vatt');if(va)va.onclick=async e=>{const t=e.target.closest('[data-att]');if(!t)return;const a=f.att.find(z=>z.id===t.dataset.att),vw=$('#vw');
    vw.style.display='block';vw.innerHTML='<p>Chargement…</p>';vw.scrollIntoView({behavior:'smooth',block:'start'});
    let blob=null;try{blob=await fget(a.id)}catch(er){}if(!blob){vw.innerHTML='<p>Fichier introuvable.</p>';return}
    if(a.kind==='img'){vw.innerHTML=`<img src="${URL.createObjectURL(blob)}" alt="">`;return}
    try{const L=await loadPdf(),pdf=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;vw.innerHTML='';const W=vw.clientWidth||340,dpr=Math.min(2,devicePixelRatio||1);
      for(let i=1;i<=Math.min(pdf.numPages,10);i++){const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:W*dpr/v0.width});const c=document.createElement('canvas');c.width=v.width;c.height=v.height;vw.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}}
    catch(er){vw.innerHTML='<p>Aperçu du PDF indisponible ici.</p>'}}}

/* ---- objectifs ---- */
function O(){return S.data.obj||(S.data.obj={items:[]})}
const saved=g=>(g.dep||[]).reduce((s,d)=>s+d.m,0);
const pct=g=>g.kind==='ep'?Math.min(100,g.target?saved(g)/g.target*100:0):(g.prog||0);
const ring=(p,cls='')=>{const C=2*Math.PI*30;return `<div class="ring ${cls}"><svg viewBox="0 0 72 72"><circle class="bg" cx="36" cy="36" r="30"/><circle class="fg" cx="36" cy="36" r="30" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><b>${Math.round(p)}%</b></div>`};
function objHome(){const g=S.data.obj?.items.filter(x=>!x.done).sort((a,b)=>(a.dl||'9').localeCompare(b.dl||'9'))[0];if(!g)return null;
  return esc(g.t)+`<div class="e" style="font-size:14px;font-weight:400;margin-top:2px">${Math.round(pct(g))} %${g.kind==='ep'?' · '+fmt(saved(g)):''}</div>`}
function goalSub(g){const parts=[];if(g.kind==='ep')parts.push(fmt(saved(g))+' / '+fmt(g.target));
  if(g.done)parts.push('Atteint');else if(g.dl){const n=dleft(g.dl);parts.push(n<0?'Date dépassée':n===0?'Dernier jour':n+' jour'+(n>1?'s':'')+' restants')}
  return parts.join(' · ')}
function perMonth(g){if(g.kind!=='ep'||!g.dl||g.done)return null;const rest=g.target-saved(g);if(rest<=0)return null;
  const T=new Date(),D=new Date(g.dl+'T12:00');const mo=Math.max(1,(D.getFullYear()-T.getFullYear())*12+D.getMonth()-T.getMonth());return rest/mo}

function obj(){const it=O().items,act=it.filter(g=>!g.done).sort((a,b)=>(a.dl||'9').localeCompare(b.dl||'9')),ok=it.filter(g=>g.done);
  const tot=it.filter(g=>g.kind==='ep').reduce((s,g)=>s+saved(g),0);
  const card=(g,i)=>`<button class="goal glass ${g.done?'ok':''}" data-g="${g.id}" style="animation-delay:${i*50}ms">${ring(pct(g))}<span class="n"><b>${esc(g.t)}</b><span>${goalSub(g)}</span>
    ${perMonth(g)?`<span style="color:var(--or2)">${fmt(Math.ceil(perMonth(g)))} par mois pour y arriver</span>`:''}</span></button>`;
  $('#obody').innerHTML=`<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb067"/><stop offset="1" stop-color="#e8590c"/></linearGradient></defs></svg>
  <div class="stats" style="margin-top:16px"><div class="stat glass"><span>Épargné</span><b class="pos">${fmt(tot)}</b></div><div class="stat glass"><span>En cours</span><b>${act.length}</b></div><div class="stat glass"><span>Atteints</span><b>${ok.length}</b></div></div>
  <h2>En cours</h2>${act.length?act.map(card).join(''):'<div class="glass box"><p class="sub" style="margin:0">Touche + pour créer un objectif d’épargne (ex. 500 € pour un voyage) ou un objectif perso.</p></div>'}
  ${ok.length?`<h2>Atteints</h2>${ok.map(card).join('')}`:''}<div style="height:80px"></div>`;
}
$('#obody').onclick=e=>{const x=e.target.closest('[data-g]');if(x)goalView(O().items.find(g=>g.id===x.dataset.g))};

function objForm(item){const x=item?{...item}:{kind:'ep',t:'',target:'',dl:'',prog:0};
  const draw=()=>{sheet(`<h2 style="margin-top:0">${item?'Modifier l’objectif':'Nouvel objectif'}</h2>
    ${item?'':`<div class="seg" id="ok2"><button data-k="ep" class="${x.kind==='ep'?'on':''}">Épargne</button><button data-k="pe" class="${x.kind==='pe'?'on':''}">Perso</button></div>`}
    ${fl('on','Nom',x.t,{ph:x.kind==='ep'?'Ex. Voyage cet été':'Ex. Courir 10 km'})}
    ${x.kind==='ep'?fl('oc','Montant à atteindre (€)',dec(x.target),{im:'decimal',ph:'Ex. 500'}):''}
    ${fl('od','Date limite (facultatif)',x.dl,{type:'date'})}
    ${x.kind==='ep'?'<p class="note" style="margin-left:0">L’argent que tu mettras de côté sera retiré de ton compte courant dans la Banque.</p>':''}
    ${acts(item)}`);
    const k=$('#ok2');if(k)k.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;x.t=$('#on').value;x.dl=$('#od').value;if($('#oc'))x.target=$('#oc').value;x.kind=b.dataset.k;draw()};
    $('#ok').onclick=()=>{const t=$('#on').value.trim();if(!t)return toast('Donne-lui un nom');let target=0;
      if(x.kind==='ep'){target=nv('oc');if(!(target>0))return toast('Entre le montant à atteindre')}
      const o={...x,id:x.id||uid(),t:t.slice(0,40),dl:$('#od').value,created:x.created||Date.now(),dep:x.dep||[]};if(x.kind==='ep')o.target=Math.round(target*100)/100;
      const L=O().items,i=L.findIndex(g=>g.id===o.id);i>=0?L[i]=o:L.push(o);if(o.kind==='ep'&&saved(o)>=o.target)o.done=true;save();close();obj();toast('Objectif enregistré')};
    onDel(()=>{const L=O().items,s0=saved(item);if(s0>0)B().tx.push({id:uid(),t:'rev',m:Math.round(s0*100)/100,c:'epargne',n:'Fin objectif '+item.t,d:td()});
      L.splice(L.indexOf(L.find(g=>g.id===item.id)),1);save();close();obj();toast(s0>0?'Supprimé, '+fmt(s0)+' remis sur ton compte':'Objectif supprimé')})};
  draw()}

function goalView(g){const p=pct(g),pm=perMonth(g);
  sheet(`<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb067"/><stop offset="1" stop-color="#e8590c"/></linearGradient></defs></svg>
  <h2 style="margin:0;text-align:center">${esc(g.t)}</h2>${ring(p,'bigring'+(g.done?'':''))}
  <p class="sub" style="text-align:center;margin:0">${goalSub(g)}</p>${pm?`<p style="text-align:center;margin:4px 0 0;color:var(--or2)">${fmt(Math.ceil(pm))} par mois pour y arriver</p>`:''}
  ${g.kind==='ep'?`<div class="acts" style="justify-content:center;margin-top:16px"><button class="btn" id="gin">Mettre de côté</button><button class="btn sec" id="gout">Retirer</button></div>
    ${(g.dep||[]).length?`<h2 style="margin-top:22px">Historique</h2><div class="glass list">${[...g.dep].sort((a,b)=>b.d.localeCompare(a.d)).map(d=>`<button class="tx" data-dp="${d.id}"><span class="n">${d.m>0?'Mis de côté':'Retiré'}<small>${fd(d.d)} · toucher pour annuler</small></span><span class="a ${d.m>0?'pos':''}">${d.m>0?'+':'−'}${fmt(Math.abs(d.m))}</span></button>`).join('')}</div>`:''}`
  :`${g.done?'':`<label class="fl" style="margin-top:18px">Où tu en es : <b id="gpv">${g.prog||0} %</b><input type="range" id="gpr" min="0" max="100" step="5" value="${g.prog||0}"></label>`}`}
  <div class="acts" style="margin-top:18px">${g.kind==='pe'?`<button class="btn" id="gdone">${g.done?'Remettre en cours':'Objectif atteint !'}</button>`:''}<button class="btn sec" id="ged">Modifier</button><button class="btn sec" data-close>Fermer</button></div>`);
  $('#ged').onclick=()=>objForm(g);
  const re=m=>{save();obj();goalView(g);if(m)toast(m)};
  if(g.kind==='pe'){const r=$('#gpr');if(r){r.oninput=()=>{$('#gpv').textContent=r.value+' %'};r.onchange=()=>{g.prog=+r.value;if(g.prog>=100)g.done=true;re(g.done?'Objectif atteint, bravo !':'')}}
    $('#gdone').onclick=()=>{g.done=!g.done;if(g.done)g.prog=100;re(g.done?'Objectif atteint, bravo !':'Remis en cours')}}
  else{
    const move=sign=>{const max=sign<0?saved(g):null;
      sheet(`<h2 style="margin-top:0">${sign>0?'Mettre de côté':'Retirer de l’objectif'}</h2><p class="sub">${esc(g.t)} · ${fmt(saved(g))} déjà de côté</p>
      ${fl('gm','Montant (€)','',{im:'decimal',ph:'Ex. 50'})}${fl('gd','Date',td(),{type:'date'})}
      <p class="note" style="margin-left:0">${sign>0?'Ce montant sera retiré de ton compte courant.':'Ce montant reviendra sur ton compte courant.'}</p>
      <div class="acts"><button class="btn" id="ok">Valider</button><button class="btn sec" id="gback">Retour</button></div>`);
      $('#gm').focus();$('#gback').onclick=()=>goalView(g);
      $('#ok').onclick=()=>{let m=nv('gm');if(!(m>0))return toast('Entre un montant');m=Math.round(m*100)/100;if(sign<0&&m>max+.001)return toast('Tu n’as que '+fmt(max)+' de côté');
        const d={id:uid(),m:sign*m,d:$('#gd').value||td()};(g.dep=g.dep||[]).push(d);
        syncTx('obj:'+d.id,sign>0?{m,c:'epargne',n:'Épargne · '+g.t,d:d.d}:{t:'rev',m,c:'epargne',n:'Retrait · '+g.t,d:d.d});
        const was=g.done;g.done=saved(g)>=g.target;re(g.done&&!was?'Objectif atteint, bravo !':sign>0?fmt(m)+' mis de côté':fmt(m)+' remis sur ton compte')}};
    $('#gin').onclick=()=>move(1);$('#gout').onclick=()=>{if(saved(g)<=0)return toast('Rien à retirer pour l’instant');move(-1)};
    $('#sheetB').querySelectorAll('[data-dp]').forEach(b=>{let arm=false;b.onclick=()=>{if(!arm){arm=true;b.querySelector('small').textContent='Toucher encore pour annuler ce mouvement';return}
      g.dep.splice(g.dep.findIndex(d=>d.id===b.dataset.dp),1);syncTx('obj:'+b.dataset.dp,null);g.done=saved(g)>=g.target;re('Mouvement annulé')}});
  }
}

/* ---- abonnements ---- */
function A(){return S.data.abos||(S.data.abos={items:[]})}
const PAL=['#e50914','#1db954','#0a84ff','#ff7a1a','#a78bfa','#f472b6','#2dd4bf','#facc15'];
const pcol=n=>PAL[[...n].reduce((s,c)=>s+c.charCodeAt(0),0)%PAL.length];
function aboNext(a){if(a.end)return null;const T=td();let M=ym(T)<a.from?a.from:ym(T);
  for(let i=0;i<14;i++,M=addM(M,1)){if(a.yr&&+M.slice(5)!==a.mon)continue;const d=M+'-'+pad(Math.min(a.day,dim(M)));if(d>=T&&M>=a.from)return d}return null}
const parMois=a=>a.yr?a.m/12:a.m;
function aboHome(){const L=S.data.abos?.items.filter(a=>!a.end).map(a=>({a,d:aboNext(a)})).filter(x=>x.d).sort((x,y)=>x.d.localeCompare(y.d));if(!L?.length)return null;
  const {a,d}=L[0],n=dleft(d);return esc(a.n)+`<div class="e" style="font-size:14px;font-weight:400;margin-top:2px">${fmt(a.m)} · ${n===0?'aujourd’hui':n===1?'demain':'dans '+n+' j'}</div>`}
function aboFixe(a){const b=B(),i=b.fixes.findIndex(f=>f.id==='abo:'+a.id);
  if(a.end){if(i>=0)b.fixes.splice(i,1);return}
  const f={id:'abo:'+a.id,t:'dep',m:a.m,c:'abos',n:a.n,day:a.day,from:a.from};if(a.yr){f.yr=true;f.mon=a.mon}
  i>=0?b.fixes[i]=f:b.fixes.push(f)}

function abos(){postDue();const it=A().items,act=it.filter(a=>!a.end).map(a=>({a,d:aboNext(a)})).sort((x,y)=>(x.d||'9').localeCompare(y.d||'9')),old=it.filter(a=>a.end);
  const pm=act.reduce((s,x)=>s+parMois(x.a),0);
  const alerts=act.filter(x=>x.d&&dleft(x.d)<=(x.a.trial?7:3));
  const row=({a,d})=>{const n=d?dleft(d):null;return `<button class="tx" data-ab="${a.id}"><span class="logo2" style="background:${pcol(a.n)}">${esc(a.n[0].toUpperCase())}</span>
    <span class="n">${esc(a.n)}<small>${a.end?'Résilié le '+fd(a.end):fmt(a.m)+(a.yr?' / an':' / mois')+(a.trial&&d?' · essai gratuit':'')}</small></span>
    ${d?`<span class="badge ${n<=3?'warn':''}" style="margin:0 0 0 auto;flex:none;align-self:center">${n===0?'Aujourd’hui':n===1?'Demain':fd(d).replace(/ \d{4}$/,'')}</span>`:''}</button>`};
  $('#abody').innerHTML=`<div class="stats" style="margin-top:16px"><div class="stat glass"><span>Par mois</span><b>${fmt(pm)}</b></div><div class="stat glass"><span>Par an</span><b>${fmt(pm*12)}</b></div><div class="stat glass"><span>Actifs</span><b>${act.length}</b></div></div>
  ${alerts.length?`<h2>À surveiller</h2><div class="glass box">${alerts.map(({a,d})=>{const n=dleft(d);return `<div class="rap"><i style="color:${a.trial?'#ff6b57':'#ff7a1a'};background:currentColor"></i><div><b>${esc(a.n)}</b><span>${a.trial?'Fin de l’essai gratuit':'Prélèvement de '+fmt(a.m)} ${n===0?'aujourd’hui':n===1?'demain':'dans '+n+' jours'}${a.trial?' · résilie avant si tu ne veux pas payer '+fmt(a.m):''}</span></div></div>`}).join('')}</div>`:''}
  <h2>Mes abonnements</h2>${act.length?`<div class="glass list">${act.map(row).join('')}</div>`:'<div class="glass box"><p class="sub" style="margin:0">Touche + pour ajouter ton premier abonnement (Netflix, Spotify, forfait, salle de sport…).</p></div>'}
  <p class="note">Chaque abonnement est un fixe dans la Banque : il est prélevé tout seul à sa date et compté dans tes prévisions.</p>
  ${old.length?`<h2>Résiliés</h2><div class="glass list">${old.map(a=>row({a,d:null})).join('')}</div>`:''}<div style="height:80px"></div>`;
}
$('#abody').onclick=e=>{const x=e.target.closest('[data-ab]');if(x)aboForm(A().items.find(a=>a.id===x.dataset.ab))};

function aboForm(item){const x=item?{...item}:{n:'',m:'',yr:false,trial:false};const nx=item?aboNext(item):'';
  sheet(`<h2 style="margin-top:0">${item?esc(item.n):'Nouvel abonnement'}</h2>
  ${fl('an2','Nom',x.n,{ph:'Ex. Netflix'})}${fl('am2','Prix (€)',dec(x.m),{im:'decimal',ph:'Ex. 13,49'})}
  <div class="seg" id="afr" style="margin-top:14px"><button data-v="0" class="${x.yr?'':'on'}">Chaque mois</button><button data-v="1" class="${x.yr?'on':''}">Chaque année</button></div>
  <button class="tog ${x.trial?'on':''}" id="atr"><span>Essai gratuit en cours</span><i></i></button>
  ${fl('ad2',x.trial?'Fin de l’essai (1er paiement)':'Date du prochain prélèvement',nx||'',{type:'date'})}
  ${item&&!item.end?'':''}
  <div class="acts"><button class="btn" id="ok">Enregistrer</button>${item?`${item.end?'<button class="btn sec" id="are">Réactiver</button>':'<button class="btn sec" id="ares">Résilier</button>'}<button class="btn sec" id="del" style="color:#ff8a7a">Supprimer</button>`:''}<button class="btn sec" data-close>Annuler</button></div>`);
  $('#afr').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;x.yr=b.dataset.v==='1';$('#afr').querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b))};
  $('#atr').onclick=()=>{x.trial=!x.trial;$('#atr').classList.toggle('on',x.trial);$('#ad2').parentElement.firstChild.textContent=x.trial?'Fin de l’essai (1er paiement)':'Date du prochain prélèvement'};
  const fin=m=>{save();close();abos();toast(m||'Enregistré')};
  $('#ok').onclick=()=>{const n=$('#an2').value.trim(),m=nv('am2'),d=$('#ad2').value;if(!n)return toast('Donne un nom');if(!(m>0))return toast('Entre le prix');if(!d)return toast('Choisis la date du prochain prélèvement');
    if(d<td())return toast('Choisis une date à venir');
    const o={...x,id:x.id||uid(),n:n.slice(0,30),m:Math.round(m*100)/100,day:+d.slice(8),from:ym(d),end:x.end||''};if(o.yr)o.mon=+d.slice(5,7);else delete o.mon;
    if(item&&d===nx&&item.from<o.from)o.from=item.from;
    const L=A().items,i=L.findIndex(a=>a.id===o.id);i>=0?L[i]=o:L.push(o);aboFixe(o);fin()};
  if(item){
    const r=$('#ares');if(r){let arm=false;r.onclick=()=>{if(!arm){arm=true;r.textContent='Confirmer ?';return}item.end=td();aboFixe(item);fin('Abonnement résilié')}}
    const re=$('#are');if(re)re.onclick=()=>{toast('Choisis la date du prochain prélèvement puis Enregistrer');x.end='';re.remove()};
    onDel(()=>{const L=A().items;L.splice(L.indexOf(item),1);item.end='x';aboFixe(item);fin('Abonnement supprimé')})}
}

/* ---- sport ---- */
const SPT=[['muscu','Muscu','#ff7a1a'],['course','Course','#4ade80'],['etir','Étirements','#a78bfa'],['nata','Natation','#60a5fa']];
const spt=k=>SPT.find(x=>x[0]===k)||SPT[0];
const MES=[['poids','Poids','kg'],['bras','Tour de bras','cm'],['poitrine','Tour de poitrine','cm'],['taille','Tour de taille','cm'],['cuisse','Tour de cuisse','cm']];
function Sp(){return S.data.sport||(S.data.sport={s:[],mes:[]})}
let stab='s',smet='poids',sro=null;
const n1=v=>(Math.round(v*10)/10).toLocaleString('fr-FR');
const dur=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):''):m+' min';

function sport(){const sp=Sp();document.querySelectorAll('#stabs button').forEach(x=>x.classList.toggle('on',x.dataset.st===stab));fabVis();
  if(sro){sro.disconnect();sro=null}
  let h='';const T=td();
  if(stab==='s'){const now=ym(T),L=[...sp.s].sort((a,b)=>b.d.localeCompare(a.d));
    const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return iso(d)});
    const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));const wk=sp.s.filter(x=>x.d>=iso(mon)&&x.d<=T).length;
    const ms=sp.s.filter(x=>ym(x.d)===now),mins=ms.reduce((s,x)=>s+(x.min||0),0);
    const g={};ms.forEach(x=>g[x.type]=(g[x.type]||0)+1);const mx=Math.max(1,...Object.values(g));
    const byM={};L.forEach(x=>(byM[ym(x.d)]=byM[ym(x.d)]||[]).push(x));
    h=`<div class="glass box"><div class="week">${days.map(d=>{const has=sp.s.filter(x=>x.d===d);return `<div class="${d===T?'td':''}"><i class="${has.length?'on':''}">${has.length>1?has.length:''}</i>${new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')}</div>`}).join('')}</div></div>
    <div class="stats" style="margin-top:12px"><div class="stat glass"><span>Cette semaine</span><b>${wk} séance${wk>1?'s':''}</b></div><div class="stat glass"><span>Ce mois</span><b>${ms.length} séance${ms.length>1?'s':''}</b></div><div class="stat glass"><span>Temps ce mois</span><b>${dur(mins)}</b></div></div>
    ${ms.length?`<h2>Ce mois-ci</h2><div class="glass box">${SPT.filter(t=>g[t[0]]).map(t=>`<div class="b"><div class="l"><span>${t[1]}</span><span>${g[t[0]]}</span></div><div class="t"><i style="width:${g[t[0]]/mx*100}%;background:${t[2]}"></i></div></div>`).join('')}</div>`:''}
    ${L.length?Object.keys(byM).slice(0,6).map(M=>`<h2 style="text-transform:capitalize">${mlabel(M)}</h2><div class="glass list">${byM[M].map(x=>{const t=spt(x.type);return `<button class="tx" data-se="${x.id}"><span class="dot" style="background:${t[2]}26"><i style="background:${t[2]}"></i></span>
      <span class="n">${t[1]}${x.n?' · '+esc(x.n):''}<small>${new Date(x.d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})}${x.km?' · '+n1(x.km)+' km':''}</small></span><span class="a">${x.min?dur(x.min):''}</span></button>`}).join('')}</div>`).join('')
      :'<div class="glass box" style="margin-top:12px"><p class="sub" style="margin:0">Touche + pour noter ta première séance.</p></div>'}`;
  }else{const M=[...sp.mes].sort((a,b)=>a.d.localeCompare(b.d));
    const last=k=>{const v=M.filter(x=>x[k]!=null);return [v[v.length-1],v[v.length-2]]};
    const pts=M.filter(x=>x[smet]!=null).map(x=>({d:x.d,v:x[smet]})),u=MES.find(m=>m[0]===smet)[2];
    h=`<div class="mgrid">${MES.map(([k,l,un])=>{const [a,b]=last(k);if(!a)return `<div class="stat glass"><span>${l}</span><b>—</b></div>`;const df=b?a[k]-b[k]:0;
      return `<div class="stat glass"><span>${l}</span><b>${n1(a[k])} ${un}</b><small>${b?(df>0?'+':df<0?'−':'±')+n1(Math.abs(df))+' '+un+' depuis le '+new Date(b.d+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'Première mesure'}</small></div>`}).join('')}</div>
    <h2>Évolution</h2><div class="fbar" id="mets" style="margin-top:0">${MES.map(m=>`<button class="chip ${smet===m[0]?'on':''}" data-me="${m[0]}">${m[1]}</button>`).join('')}</div>
    <div class="glass box">${pts.length>=2?'<div class="chart" id="sch"></div>':`<p class="sub" style="margin:0">${pts.length?'Ajoute une 2e mesure pour voir ta courbe.':'Pas encore de mesure.'}</p>`}</div>
    ${M.length?`<h2>Historique</h2><div class="glass list">${[...M].reverse().map(x=>`<button class="tx" data-mz="${x.id}"><span class="n">${fd(x.d)}<small>${MES.filter(m=>x[m[0]]!=null).map(m=>m[1].replace('Tour de ','')+' '+n1(x[m[0]])+' '+m[2]).join(' · ')}</small></span></button>`).join('')}</div>`
      :'<p class="note">Touche + pour entrer tes premières mesures. Mesure-toi toujours au même moment (le matin, par exemple) pour comparer.</p>'}`;
    $('#sbody').innerHTML=h+'<div style="height:80px"></div>';
    const box=$('#sch');if(box){const draw=()=>{const W=box.clientWidth,H=box.clientHeight,pl=40,pr=12,pt=14,pb=26;
      const vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs),pad2=(hi-lo)*.15||1,y0=lo-pad2,y1=hi+pad2;
      const t0=new Date(pts[0].d).getTime(),t1=new Date(pts[pts.length-1].d).getTime()||t0+1;
      const X=d=>pl+(new Date(d).getTime()-t0)/((t1-t0)||1)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
      const line=pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
      const ticks=[y0+pad2,(y0+y1)/2,y1-pad2];
      box.innerHTML=`<svg><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></linearGradient></defs>
        ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(255,255,255,.08)"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end">${n1(t)}</text>`).join('')}
        <path d="${line} L${X(pts[pts.length-1].d)} ${H-pb} L${X(pts[0].d)} ${H-pb}Z" fill="url(#sg)"/>
        <path d="${line}" fill="none" stroke="#ff7a1a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="4" fill="#0b0907" stroke="#ffb067" stroke-width="2"/>`).join('')}
        <text x="${pl}" y="${H-6}">${fd(pts[0].d).replace(/ \d{4}$/,'')}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fd(pts[pts.length-1].d).replace(/ \d{4}$/,'')}</text>
        <text x="${W-pr}" y="${pt-2}" text-anchor="end">${u}</text></svg>`};
      sro=new ResizeObserver(draw);sro.observe(box)}
    return}
  $('#sbody').innerHTML=h+'<div style="height:80px"></div>';
}
$('#stabs').onclick=e=>{const x=e.target.closest('[data-st]');if(!x)return;stab=x.dataset.st;sport()};
$('#sbody').onclick=e=>{let x;const sp=Sp();
  if(x=e.target.closest('[data-me]')){smet=x.dataset.me;sport()}
  else if(x=e.target.closest('[data-se]'))seanceForm(sp.s.find(v=>v.id===x.dataset.se));
  else if(x=e.target.closest('[data-mz]'))mesForm(sp.mes.find(v=>v.id===x.dataset.mz))};

function seanceForm(item){const sp=Sp(),x=item?{...item}:{type:'muscu',d:td(),min:'',km:'',n:''};
  const kmOn=()=>x.type==='course'||x.type==='nata';
  sheet(`<h2 style="margin-top:0">${item?'Modifier la séance':'Nouvelle séance'}</h2>
  <div class="fl">Type<div class="chips" id="sty">${SPT.map(t=>`<button class="chip ${x.type===t[0]?'on':''}" data-c="${t[0]}"><i style="background:${t[2]}"></i>${t[1]}</button>`).join('')}</div></div>
  ${fl('sd','Date',x.d,{type:'date'})}${fl('sm','Durée (minutes)',x.min||'',{im:'numeric',ph:'Ex. 60'})}
  <div id="skm" style="${kmOn()?'':'display:none'}">${fl('sk','Distance (km, facultatif)',dec(x.km),{im:'decimal',ph:'Ex. 5'})}</div>
  ${fl('sn','Note (facultatif)',x.n,{ph:'Ex. Pecs / triceps'})}${acts(item)}`);
  chipPick('sty',v=>{x.type=v;$('#skm').style.display=kmOn()?'':'none'});
  const fin=m=>{save();close();sport();toast(m||'Séance enregistrée')};
  $('#ok').onclick=()=>{const m=parseInt($('#sm').value),k=nv('sk');
    const o={id:x.id||uid(),type:x.type,d:$('#sd').value||td(),min:m>0?m:0,km:kmOn()&&k>0?Math.round(k*100)/100:0,n:$('#sn').value.trim().slice(0,40)};
    const i=sp.s.findIndex(v=>v.id===o.id);i>=0?sp.s[i]=o:sp.s.push(o);fin()};
  onDel(()=>{sp.s.splice(sp.s.indexOf(item),1);fin('Séance supprimée')})}

function mesForm(item){const sp=Sp(),x=item||{d:td()};
  sheet(`<h2 style="margin-top:0">${item?'Modifier les mesures':'Nouvelles mesures'}</h2>${fl('md','Date',x.d,{type:'date'})}
  <div class="mrow">${MES.map(([k,l,u])=>fl('m_'+k,l+' ('+u+')',x[k]!=null?dec(x[k]):'',{im:'decimal'})).join('')}</div>
  <p class="note" style="margin-left:0">Remplis seulement ce que tu as mesuré.</p>${acts(item)}`);
  const fin=m=>{save();close();sport();toast(m||'Mesures enregistrées')};
  $('#ok').onclick=()=>{const o={id:x.id||uid(),d:$('#md').value||td()};let any=false;
    for(const [k] of MES){const v=nv('m_'+k);if(v>0){o[k]=Math.round(v*10)/10;any=true}}
    if(!any)return toast('Entre au moins une mesure');const i=sp.mes.findIndex(v=>v.id===o.id);i>=0?sp.mes[i]=o:sp.mes.push(o);fin()};
  onDel(()=>{sp.mes.splice(sp.mes.indexOf(item),1);fin('Mesures supprimées')})}

/* ---- réglages ---- */
function setUI(){$('#lastSave').textContent=S.lastSave?'Dernière : '+new Date(S.lastSave).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'Jamais sauvegardé'}
const dump=async withFiles=>{const o={app:'monqg',savedAt:new Date().toISOString(),...S};
  if(withFiles){o.files={};for(const id of allFileIds()){try{const b=await fget(id);if(b)o.files[id]=await b64(b)}catch(e){}}}
  return JSON.stringify(o)};
let dl=null;
dl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);
  const type=/\.pdf$/i.test(filename)?'application/pdf':/\.jpe?g$/i.test(filename)?'image/jpeg':'application/json';
  const file=new File([blob],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return{status:'saved'}}catch(e){throw{code:e?.name==='AbortError'?'declined':'unavailable'}}}
  const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'}}};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage?.persist?.()}catch(e){}
$('#bSave').onclick=async()=>{
  const name='monqg-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
  if(dl){toast('Préparation…');try{await dl.save({filename:name,data:new Blob([await dump(true)])});S.lastSave=Date.now();save();setUI();toast('Sauvegarde créée');return}catch(e){toast(e?.code==='declined'?'Sauvegarde annulée':'Sauvegarde impossible ici');if(e?.code==='declined')return}}
  const txt=await dump(false);
  sheet(`<h2 style="margin-top:0">Sauvegarde</h2><p class="sub">Le fichier ne peut pas être créé ici. Copie ce texte et colle-le dans une note (sans les documents).</p><textarea readonly>${esc(txt)}</textarea><div class="acts"><button class="btn" id="sc">Copier</button><button class="btn sec" data-close>Fermer</button></div>`);
  $('#sc').onclick=copy;
};
async function copy(){try{await navigator.clipboard.writeText(await dump(false));S.lastSave=Date.now();save();setUI();toast('Sauvegarde copiée')}catch(e){toast('Copie refusée, sélectionne le texte à la main')}}
$('#bCopy').onclick=copy;
$('#bLoad').onclick=()=>{sheet(`<h2 style="margin-top:0">Restaurer</h2><p class="sub">Choisis ton fichier de sauvegarde ou colle le texte copié. Ça remplace les données actuelles.</p>
  <div class="acts" style="margin-bottom:12px"><button class="btn sec" id="pf">Choisir un fichier</button></div>
  <textarea id="pt" placeholder="Colle ta sauvegarde ici"></textarea><div class="acts"><button class="btn" id="pr">Restaurer</button><button class="btn sec" data-close>Annuler</button></div>`);
  $('#pf').onclick=()=>$('#file').click();$('#pr').onclick=()=>restore($('#pt').value)};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(restore);e.target.value=''};
async function restore(txt){let o;try{o=JSON.parse(txt);if(o.app!=='monqg')throw 0}catch(e){return toast('Sauvegarde non reconnue')}
  const files=o.files;delete o.app;delete o.savedAt;delete o.files;S=Object.assign(blank(),o);save();
  if(files){try{await fclear();for(const k in files)await fput(k,unb64(files[k]))}catch(e){toast('Documents non restaurés')}}
  close();toast('Données restaurées');S.pin?lockUI('enter'):lockUI('new')}
$('#bPin').onclick=()=>lockUI('new',()=>show('set'));
$('#bLockNow').onclick=()=>lockUI('enter');
$('#bWipe').onclick=()=>{sheet(`<h2 style="margin-top:0">Tout effacer ?</h2><p class="sub">Toutes tes données seront supprimées de ce téléphone. Impossible d'annuler sans sauvegarde.</p><div class="acts"><button class="btn" id="wy" style="background:#ff6b57">Oui, tout effacer</button><button class="btn sec" data-close>Annuler</button></div>`);
  $('#wy').onclick=()=>{S=blank();try{localStorage.removeItem(KEY)}catch(e){}fclear().catch(()=>{});close();lockUI('new')}};

function sheet(h){$('#sheetB').innerHTML=h;$('#sheet').classList.add('on')}
function close(){$('#sheet').classList.remove('on')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))close()});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

S.pin?lockUI('enter'):lockUI('new');
}
</script>
